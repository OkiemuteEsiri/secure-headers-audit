name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke test
        run: |
          python -m src.cli data/synthetic_targets.json --output /tmp/report.md
          grep -q "Secure Headers Assessment" /tmp/report.md
